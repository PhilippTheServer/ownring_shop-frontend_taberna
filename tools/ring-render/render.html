<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body style="margin:0;background:transparent">
<pre id="out"></pre>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const params = new URLSearchParams(location.search);
const view = params.get('view') || 'hero';
const size = Number(params.get('size') || 1600);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(size, size);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 1.0;

// Dimensions in mm: size 11 has a 20.6 mm inner diameter.
const ri = 10.3, thick = 2.5, ro = ri + thick, hw = 3.9, rcOut = 1.05, rcIn = 0.6, bulge = 0.28;

function arc(cx, cy, r, a0, a1, n, pts) {
  for (let i = 0; i <= n; i++) {
    const a = a0 + (a1 - a0) * (i / n);
    pts.push(new THREE.Vector2(cx + r * Math.cos(a), cy + r * Math.sin(a)));
  }
}
const mid = (ri + ro) / 2;
// Outer shell: from the bottom face midline round the outside to the top face midline.
const outer = [new THREE.Vector2(mid, -hw)];
arc(ro - rcOut, -hw + rcOut, rcOut, -Math.PI / 2, 0, 24, outer);
for (let i = 1; i < 30; i++) {
  const y = -hw + rcOut + (2 * (hw - rcOut)) * (i / 30);
  outer.push(new THREE.Vector2(ro, y));
}
arc(ro - rcOut, hw - rcOut, rcOut, 0, Math.PI / 2, 24, outer);
outer.push(new THREE.Vector2(mid, hw));
// Inner resin: from the top face midline round the comfort-fit inside back down.
const inner = [new THREE.Vector2(mid, hw)];
arc(ri + rcIn, hw - rcIn, rcIn, Math.PI / 2, Math.PI, 16, inner);
const h = hw - rcIn;
for (let i = 1; i < 40; i++) {
  const y = h - 2 * h * (i / 40);
  inner.push(new THREE.Vector2(ri - bulge * (1 - (y / h) ** 2), y));
}
arc(ri + rcIn, -hw + rcIn, rcIn, Math.PI, 1.5 * Math.PI, 16, inner);
inner.push(new THREE.Vector2(mid, -hw));

const shellMat = new THREE.MeshPhysicalMaterial({
  color: 0x34343a, metalness: 0.88, roughness: 0.24, clearcoat: 0.8, clearcoatRoughness: 0.12,
});
const resinMat = new THREE.MeshPhysicalMaterial({
  color: 0x0b0b0d, metalness: 0.1, roughness: 0.12, clearcoat: 1, clearcoatRoughness: 0.05,
});

const ring = new THREE.Group();
ring.add(new THREE.Mesh(new THREE.LatheGeometry(outer, 256), shellMat));
ring.add(new THREE.Mesh(new THREE.LatheGeometry(inner, 256), resinMat));

// Sensor window on the inside, facing the ring's centre at angle 0 (+x).
const sensor = new THREE.Group();
const windowMat = new THREE.MeshPhysicalMaterial({ color: 0x050507, metalness: 0, roughness: 0.04, clearcoat: 1, transmission: 0 });
const win = new THREE.Mesh(new RoundedBoxGeometry(0.7, 4.6, 3.0, 4, 0.33), windowMat);
sensor.add(win);
const green = new THREE.MeshStandardMaterial({ color: 0x0c2a14, emissive: 0x3dff7a, emissiveIntensity: 2.2 });
const red = new THREE.MeshStandardMaterial({ color: 0x2a0c0c, emissive: 0xff4a3d, emissiveIntensity: 1.4 });
const pd = new THREE.MeshPhysicalMaterial({ color: 0x1c2230, metalness: 0.6, roughness: 0.25 });
const dot = (mat, y, z, r) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.12, 32), mat); m.rotation.z = Math.PI / 2; m.position.set(-0.36, y, z); sensor.add(m); };
dot(green, 1.15, -0.55, 0.32); dot(green, 1.15, 0.55, 0.32); dot(red, -1.1, 0, 0.28); dot(pd, 0.05, 0, 0.42);
sensor.position.set(ri - bulge + 0.12, 0, 0);
ring.add(sensor);
// Two charging pads beside the sensor.
const padMat = new THREE.MeshPhysicalMaterial({ color: 0xc9b38a, metalness: 1, roughness: 0.22 });
for (const a of [0.42, -0.42]) {
  const pad = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.14, 32), padMat);
  pad.rotation.z = Math.PI / 2;
  const r = ri - bulge + 0.02;
  pad.position.set(r * Math.cos(a), 0, r * Math.sin(a));
  pad.rotation.y = -a;
  ring.add(pad);
}
scene.add(ring);

// Lights: soft key, cool fill, and a warm pulse-coloured rim.
const key = new THREE.DirectionalLight(0xffffff, 3.0); key.position.set(-30, 40, 35); scene.add(key);
const fill = new THREE.DirectionalLight(0xdfe7ff, 0.6); fill.position.set(40, -10, 30); scene.add(fill);
const rim = new THREE.DirectionalLight(0xfa8785, 5.0); rim.position.set(45, 25, -40); scene.add(rim);
const rim2 = new THREE.DirectionalLight(0xad9dff, 2.4); rim2.position.set(-45, -20, -35); scene.add(rim2);
const glow = new THREE.PointLight(0x3dff7a, 6, 14, 2); scene.add(glow);

const camera = new THREE.PerspectiveCamera(24, 1, 1, 400);
if (view === 'hero') {
  ring.rotation.set(1.02, 0.0, -0.34);
  ring.rotateY(Math.PI * 0.62);
  camera.position.set(0, 4, 72);
} else if (view === 'inside') {
  ring.rotation.set(0.32, 0, 0);
  ring.rotateY(Math.PI * 0.5);
  camera.position.set(0, 2, 64);
} else if (view === 'side') {
  ring.rotation.set(Math.PI / 2 - 0.12, 0, 0.06);
  ring.rotateY(Math.PI * 1.15);
  camera.position.set(0, 0, 70);
}
camera.lookAt(0, 0, 0);
ring.updateMatrixWorld(true);
sensor.getWorldPosition(glow.position);
glow.position.multiplyScalar(0.8);

renderer.render(scene, camera);
document.getElementById('out').textContent = 'DATA:' + renderer.domElement.toDataURL('image/png') + ':END';
</script>
</body>
</html>
